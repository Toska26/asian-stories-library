name: Build Biblioteca

on:
  push:
    paths:
      - 'datos/dramas/**'
      - 'datos/SHIPS.json'
      - 'datos/PERSONAS.json'
      - 'build-biblioteca.js'
    branches:
      - main
  workflow_dispatch:

# Agrupa todas las ejecuciones de la rama main y las pone en cola en lugar de cancelarlas
concurrency:
  group: pages-and-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generar biblioteca.js
        run: node build-biblioteca.js

      - name: Guardar y subir cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/biblioteca.js
          git diff --staged --quiet || (git commit -m "chore: auto-build biblioteca.js [skip ci]" && git push)
