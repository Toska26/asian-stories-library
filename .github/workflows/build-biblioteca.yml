name: Build Biblioteca e Índices Cruzados

on:
  push:
    paths:
      - 'datos/dramas/**'
      - 'datos/SHIPS.json'
      - 'datos/PERSONAS.json'
      - 'scripts/build-biblioteca.js'
      - 'scripts/build-indices.js'
      - 'scripts/indice_dramas_alfabetico.js'
  workflow_dispatch:

concurrency:
  group: pages-and-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generar biblioteca.js
        run: node scripts/build-biblioteca.js

      - name: Generar índices cruzados
        run: node scripts/build-indices.js

      - name: Generar índice alfabético en texto plano
        run: node scripts/indice_dramas_alfabetico.js

      - name: Guardar y subir cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/biblioteca.js datos/personas_dramas.js datos/ships_dramas.js datos/entidades_dramas.js informacion/indice_dramas_alfabetico.txt
          git diff --staged --quiet || (git commit -m "chore: auto-build biblioteca e índices cruzados [skip ci]" && git push)
