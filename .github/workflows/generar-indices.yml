name: Generar Índices Bajo Demanda

on:
  workflow_dispatch:

permissions:
  contents: write  # <-- Esto le da permiso al bot para guardar y hacer git push en tu repositorio

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 🚀 Ejecutar script de índices
        run: node scripts/generar-indices.js

      - name: 💾 Guardar cambios en el repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🛠️ Generación manual de indices.json bajo demanda"
          file_pattern: "datos/indices.json"
