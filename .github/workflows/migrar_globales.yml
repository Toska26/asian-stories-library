name: Migrar Globales a JSON

on:
  workflow_dispatch: # Se ejecuta manualmente haciendo clic en un botón

permissions:
  contents: write

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Ejecutar script de migración
        run: node migrar-globales.js

      - name: Subir los nuevos ficheros JSON a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/
          git diff --staged --quiet || (git commit -m "chore: generar archivos json desde script de migracion" && git push)
