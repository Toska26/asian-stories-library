name: Actualizar y Normalizar Datos JSON

on:
  workflow_dispatch:

# Añadimos estos permisos explícitos para que el bot pueda escribir en el repo
permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar script de actualización masiva
        run: node scripts/normalizar-datos.js

      - name: Commit y Push de los cambios
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "chore: actualización y normalización masiva automática de estados/datos" || echo "No hay cambios que commitear"
          git push
