name: Generar Índices Cruzados

on:
  workflow_dispatch:
  push:
    paths:
      - 'build-indices.js'

concurrency:
  group: indices-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Ejecutar generación de índices
        run: node build-indices.js

      - name: Guardar y subir cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/personas_dramas.js datos/ships_dramas.js datos/entidades_dramas.js
          git diff --staged --quiet || (git commit -m "chore: auto-build índices cruzados [skip ci]" && git push)
