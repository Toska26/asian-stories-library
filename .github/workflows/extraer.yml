name: Ejecutar Extracción de Campos

on:
  workflow_dispatch: # Permite lanzarlo manualmente cuando lo necesites desde la pestaña Actions

permissions:
  contents: write

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Ejecutar script de extracción
        run: node scripts/extraer_campo.js

      - name: Guardar y subir el informe a la carpeta informacion
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add informacion/
          git diff --staged --quiet || (git commit -m "chore: actualizar informe de extracción [skip ci]" && git push)
