name: Build Biblioteca

on:
  push:
    paths:
      - 'datos/dramas/**'
      - 'datos/SHIPS.js'
      - 'datos/PERSONAS.js'
      - 'build-biblioteca.js'
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar biblioteca.js
        run: node build-biblioteca.js

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/biblioteca.js
          git diff --staged --quiet || (git commit -m "chore: auto-build biblioteca.js [skip ci]" && git push)
