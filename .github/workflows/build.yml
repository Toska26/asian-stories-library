name: Generar Biblioteca de Dramas

on:
  push:
    paths:
      - 'datos/dramas/**'
      - 'datos/SHIPS.js'
      - 'datos/PERSONAS.js'
      - 'build-biblioteca.js'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Ejecutar script de biblioteca
        run: node build-biblioteca.js

      - name: Guardar cambios en GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "bot: actualización automática de datos/biblioteca.js"
          file_pattern: "datos/biblioteca.js"
